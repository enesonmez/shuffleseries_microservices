services:
  # 1. API Gateway (Tüm dış trafiğin tek giriş kapısı - YARP)
  apigateway:
    image: shuffleseries_apigateway:latest
    build:
      context: .
      dockerfile: ShuffleSeries.ApiGateway/Dockerfile
    container_name: shuffleseries_apigateway
    ports:
      - "6000:8080" # Dışarıdan 6000 portu ile içerideki 8080'e yönlendiriyoruz
    networks:
      - shuffle_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - catalog.api
  
  # 2. Catalog Service (Yazdığımız dikey dilim mimarili servis)
  catalog.api:
    image: shuffleseries_catalog:latest
    build:
      context: .
      dockerfile: ShuffleSeries.Catalog/ShuffleSeries.Catalog.Api/Dockerfile
    container_name: shuffleseries_catalog
    networks:
      - shuffle_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Container içi iletişimde host olarak lokal yerine 'postgres' servis adını yazıyoruz
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=${POSTGRES_DB_NAME};Username=${POSTGRES_DB_USER};Password=${POSTGRES_DB_PASSWORD};Maximum Pool Size=50;
      - MessageBroker__Host=rabbitmq
      - MessageBroker__Username=${RABBITMQ_USER:-guest}
      - MessageBroker__Password=${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    
  # 3. İlişkisel Veritabanı (Catalog Servisi verilerini tutar)
  postgres:
    image: postgres:16-alpine
    container_name: shuffleseries_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_DB_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shuffle_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_DB_USER:-admin} -d ${POSTGRES_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  # 4. Message Broker (RabbitMQ)    
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: shuffleseries_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"   # Uygulamaların iletişim kuracağı AMQP portu
      - "15672:15672" # Tarayıcıdan gireceğimiz Yönetim Paneli portu
    networks:
      - shuffle_network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  shuffle_network:
    driver: bridge
