services:
  # 1. Catalog Mikroservisi (Content Catalog - Movies, Series, Episodes)
  catalog-api:
    build:
      context: .
      dockerfile: ShuffleSeries.Catalog/ShuffleSeries.Catalog.Api/Dockerfile
    container_name: shuffleseries_catalog_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5010:8080"
      - "127.0.0.1:5012:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kestrel__Endpoints__Http__Url=http://0.0.0.0:8080
      - Kestrel__Endpoints__Http__Protocols=Http1
      - Kestrel__Endpoints__Grpc__Url=http://0.0.0.0:8081
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - Vault__Address=http://vault:8200
      - Vault__Token=${VAULT_ROOT_TOKEN:-root}
      - Vault__MountPoint=secret
      - Vault__Optional=false
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault_init:
        condition: service_completed_successfully
    networks:
      shuffle_network:
        aliases:
          - catalog.api
          - catalog-api

  # 2. Identity Mikroservisi (Authentication, JWT, Social Login, Sessions)
  identity-api:
    build:
      context: .
      dockerfile: ShuffleSeries.Identity/ShuffleSeries.Identity.Api/Dockerfile
    container_name: shuffleseries_identity_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5011:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Vault__Address=http://vault:8200
      - Vault__Token=${VAULT_ROOT_TOKEN:-root}
      - Vault__MountPoint=secret
      - Vault__Optional=false
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault_init:
        condition: service_completed_successfully
    networks:
      shuffle_network:
        aliases:
          - identity.api
          - identity-api

  # 3. Shuffle Engine Mikroservisi (Redis In-Memory Roulette Pool, Event Sync & Recommendation Engine)
  shuffleengine-api:
    build:
      context: .
      dockerfile: ShuffleSeries.ShuffleEngine/ShuffleSeries.ShuffleEngine.Api/Dockerfile
    container_name: shuffleseries_shuffleengine_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5013:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Vault__Address=http://vault:8200
      - Vault__Token=${VAULT_ROOT_TOKEN:-root}
      - Vault__MountPoint=secret
      - Vault__Optional=false
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault_init:
        condition: service_completed_successfully
      catalog-api:
        condition: service_started
    networks:
      shuffle_network:
        aliases:
          - shuffleengine.api
          - shuffleengine-api

  # 4. YARP API Gateway (Reverse Proxy, Route Management, Swagger Aggregation)
  api-gateway:
    build:
      context: .
      dockerfile: ShuffleSeries.ApiGateway/ShuffleSeries.ApiGateway.Api/Dockerfile
    container_name: shuffleseries_api_gateway
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Vault__Address=http://vault:8200
      - Vault__Token=${VAULT_ROOT_TOKEN:-root}
      - Vault__MountPoint=secret
      - Vault__Optional=false
    depends_on:
      catalog-api:
        condition: service_started
      identity-api:
        condition: service_started
      shuffleengine-api:
        condition: service_started
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault_init:
        condition: service_completed_successfully
    networks:
      shuffle_network:
        aliases:
          - api-gateway
          - apigateway

networks:
  shuffle_network:
    name: shuffleseries_network
