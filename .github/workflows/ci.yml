name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  build-and-test:
    name: Build, Test & SonarQube Analysis
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full git history required for SonarQube analysis & blame

      - name: ☕ Setup Java 21 (SonarScanner Requirement)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟣 Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Cache NuGet Packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 🧹 Check Code Formatting (Style Gate)
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: 🔧 Install SonarScanner .NET Global Tool
        run: dotnet tool install --global dotnet-sonarscanner

      - name: 🛡️ Begin SonarQube Analysis (if token configured)
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet-sonarscanner begin \
            /k:"${{ secrets.SONAR_PROJECT_KEY || 'ShuffleSeries.Microservices' }}" \
            /o:"${{ secrets.SONAR_ORGANIZATION || 'shuffleseries' }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/*.Tests/**,**/Migrations/**"

      - name: 🔄 Restore NuGet Dependencies
        run: dotnet restore

      - name: 🔨 Build Solution (Release Mode)
        run: dotnet build --no-restore --configuration Release

      - name: 🧪 Execute Unit & Integration Tests (with Coverage)
        run: |
          dotnet test --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura

      - name: 🏁 End SonarQube Analysis & Upload Quality Gate Report
        if: env.SONAR_TOKEN != ''
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: 📊 Upload Test & Code Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-and-coverage
          path: ./TestResults/
          retention-days: 14

  docker-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 📦 Build Catalog Service Container Image
        run: docker build -f ShuffleSeries.Catalog/ShuffleSeries.Catalog.Api/Dockerfile -t shuffleseries-catalog:ci .

      - name: 🚪 Build API Gateway Container Image
        run: docker build -f ShuffleSeries.ApiGateway/Dockerfile -t shuffleseries-apigateway:ci .
